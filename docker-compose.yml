services:

  # ────────────────────────────────────────────
  # SentryCage — whale tracker (required)
  # ────────────────────────────────────────────
  sentrycage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentrycage
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DB_PATH=/app/data/whale_tracker.db
    volumes:
      - sentrycage-data:/app/data
      - ./src/config/wallet_registry.py:/app/src/config/wallet_registry.py:ro
    networks:
      - sentrycage-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "from src.database.sqlite import init_db; init_db()"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────
  # Ollama — local LLM for AI reasoning (optional)
  # Remove this service if you use Claude/OpenAI API
  # or if you run Ollama directly on the host.
  # ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sentrycage-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - sentrycage-net
    # GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Pulls the LLM model once on first run, then exits
  ollama-init:
    image: ollama/ollama:latest
    container_name: sentrycage-ollama-init
    depends_on:
      - ollama
    networks:
      - sentrycage-net
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull ${OLLAMA_MODEL:-llama3.1:8b} &&
        echo 'Model ready.'
      "
    restart: "no"

volumes:
  sentrycage-data:
  ollama-data:

networks:
  sentrycage-net:
    driver: bridge
