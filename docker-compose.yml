version: '3.8'

services:
  # Main Whale Tracker application
  whale-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-tracker
    restart: unless-stopped
    environment:
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - ENABLE_REASONING=${ENABLE_REASONING:-true}
      - MAX_REASONING_ITERATIONS=${MAX_REASONING_ITERATIONS:-5}
      - REASONING_TIMEOUT=${REASONING_TIMEOUT:-30}

      # LMStudio (host machine)
      - LMSTUDIO_URL=${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-local-model}

      # Ollama (Docker service)
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}

      # Claude API
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}

      # OpenAI API
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}

      # Blockchain API Keys
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - ARBISCAN_API_KEY=${ARBISCAN_API_KEY}
      - INFURA_API_KEY=${INFURA_API_KEY}

      # Telegram Bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

      # Application Settings
      - POLLING_INTERVAL=${POLLING_INTERVAL:-60}
      - TRANSACTION_THRESHOLD=${TRANSACTION_THRESHOLD:-50}
    volumes:
      - ./logs:/app/logs
      - ./whale_tracker.log:/app/whale_tracker.log
    depends_on:
      - ollama
    networks:
      - whale-tracker-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Ollama LLM server
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - whale-tracker-network
    # Uncomment for GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Ollama model puller (runs once to download model)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    networks:
      - whale-tracker-network
    command: >
      sh -c "
        sleep 10 &&
        ollama pull ${OLLAMA_MODEL:-llama3.1:8b} &&
        echo 'Model pulled successfully!'
      "
    restart: "no"

volumes:
  ollama-data:
    driver: local

networks:
  whale-tracker-network:
    driver: bridge
